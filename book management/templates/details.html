<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.name }} — Book Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar-lib">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{{ url_for('home') }}" class="brand">📚 BOOK MANAGEMENT</a>
        <div class="d-flex gap-1">
            <a href="{{ url_for('home') }}" class="nav-link-lib">Home</a>
            <a href="{{ url_for('add_books') }}" class="nav-link-lib">Add Book</a>
            <a href="{{ url_for('dashboard') }}" class="nav-link-lib">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container pb-5" style="max-width: 560px;">

    <div class="card book-card p-4">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <h1 class="h3 mb-0">{{ book.name }}</h1>
            <span class="badge-category">{{ book.category }}</span>
        </div>
        <p class="text-muted mb-3">by {{ book.author }}</p>
        <div class="price-tag fs-3 mb-4">₹{{ "%.2f"|format(book.price) }}</div>

        <table class="table table-sm">
            <tr><th style="width: 140px;">Category</th><td>{{ book.category }}</td></tr>
            <tr><th>Price</th><td>₹{{ "%.2f"|format(book.price) }}</td></tr>
            <tr><th>Added on</th><td>{{ book.created_at }}</td></tr>
        </table>

        <div class="d-flex gap-2 mt-2">
            <a href="{{ url_for('edit_books', book_id=book.id) }}" class="btn btn-gold">Edit</a>
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">Back to Library</a>
            <form method="post" action="{{ url_for('delete_books', book_id=book.id) }}"
                  onsubmit="return confirm('Delete \'{{ book.name }}\'?');" class="ms-auto">
                <button type="submit" class="btn btn-outline-danger">Delete</button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
