<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book — Book Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar-lib">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{{ url_for('home') }}" class="brand">📚 BOOK MANAGEMENT</a>
        <div class="d-flex gap-1">
            <a href="{{ url_for('home') }}" class="nav-link-lib">Home</a>
            <a href="{{ url_for('add_books') }}" class="nav-link-lib">Add Book</a>
            <a href="{{ url_for('dashboard') }}" class="nav-link-lib">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container pb-5" style="max-width: 560px;">

    <div class="card book-card p-4">
        <h1 class="h3 mb-1">Edit Book</h1>
        <p class="text-muted mb-4">Update the details for this title.</p>

        {% if errors %}
            <div class="alert alert-danger">
                <ul class="mb-0">
                    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="post" action="{{ url_for('edit_books', book_id=book.id) }}">
            <div class="mb-3">
                <label class="form-label">Book Name</label>
                <input type="text" class="form-control" name="name" value="{{ book.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Author</label>
                <input type="text" class="form-control" name="author" value="{{ book.author }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" step="0.01" min="0.01" class="form-control" name="price" value="{{ book.price }}" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Category</label>
                <select class="form-select" name="category" required>
                    {% for c in categories %}
                        <option value="{{ c }}" {% if book.category == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-gold">Save Changes</button>
                <a href="{{ url_for('book_details', book_id=book.id) }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
